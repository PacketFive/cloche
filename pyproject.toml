# SPDX-License-Identifier: GPL-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloche"
dynamic = ["version"]
description = "Run a program in an unprivileged Linux sandbox, from Python or the command line"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "PacketFive" }]
keywords = [
  "sandbox", "namespaces", "seccomp", "isolation", "reproducible-builds", "oci", "microvm",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.6,<3"]

[project.urls]
Homepage = "https://github.com/PacketFive/cloche"
Source = "https://github.com/PacketFive/cloche"
Issues = "https://github.com/PacketFive/cloche/issues"

[dependency-groups]
# Everything the quality gates need, installed with "pip install --group dev"
# (pip 25.1 or later). Groups are not part of the package metadata, so the
# pybootstrap name on PyPI, which belongs to an unrelated placeholder, can be
# replaced by its repository here.
dev = [
  "pybootstrap @ git+https://github.com/packetfive/pybootstrap.git",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
cloche = "cloche.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cloche.__version__" }

# The repository's src directory is the cloche package itself.
[tool.setuptools]
packages = ["cloche"]
package-dir = { cloche = "src" }

# PEP 561 marker: the package ships its own type hints.
[tool.setuptools.package-data]
cloche = ["py.typed", "guest_init.c"]

# Quality gates, run with 'pybootstrap check'.
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "cloche"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run programs, and test names describe themselves.
"tests/*" = ["S101", "S603", "S607", "D"]

# Tests import the installed package by name, since src/ has no
# cloche/ directory for ruff to discover it from.
[tool.ruff.lint.isort]
known-first-party = ["cloche"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=term-missing --import-mode=importlib"
markers = [
  "requires_userns: needs unprivileged user namespaces and a C compiler that links statically",
  "requires_microvm: needs /dev/kvm, a monitor in PATH and CLOCHE_TEST_KERNEL, a guest vmlinux",
]
